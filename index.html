<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience — Laboratorio de experiencias</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a12;
    --bg2: #12121f;
    --text: #eae8f4;
    --muted: #9d99b3;
    --accent: #8ee3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 4vw 5vw 6vw;
  }
  header {
    max-width: 900px;
    margin: 0 auto 3rem;
    text-align: center;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0 0 0.5rem;
    letter-spacing: 0.02em;
    background: linear-gradient(120deg, #fff, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    max-width: 640px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 1.6rem;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  a.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 0%, var(--card-accent, var(--accent)) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  a.card:hover {
    transform: translateY(-4px);
    border-color: var(--card-accent, var(--accent));
    background: rgba(255,255,255,0.05);
  }
  a.card:hover::before { opacity: 0.12; }
  .thumb {
    position: relative;
    height: 64px;
    margin: -0.2rem 0 1rem;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .thumb--waves span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--card-accent, var(--accent));
    transform: translate(-50%, -50%);
    animation: ripple 2.6s ease-out infinite;
    opacity: 0;
  }
  .thumb--waves span:nth-child(2) { animation-delay: 0.65s; }
  .thumb--waves span:nth-child(3) { animation-delay: 1.3s; }
  @keyframes ripple {
    0% { width: 10px; height: 10px; opacity: 0.8; }
    100% { width: 140px; height: 140px; opacity: 0; }
  }
  .thumb--grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    padding: 8px;
    height: 100%;
  }
  .thumb--grid i {
    background: var(--card-accent, var(--accent));
    border-radius: 3px;
    opacity: 0.12;
    animation: blink 3.2s ease-in-out infinite;
  }
  .thumb--grid i:nth-child(4n) { animation-delay: 0.2s; }
  .thumb--grid i:nth-child(5n) { animation-delay: 0.9s; }
  .thumb--grid i:nth-child(7n) { animation-delay: 1.6s; }
  @keyframes blink {
    0%, 100% { opacity: 0.1; }
    50% { opacity: 0.75; }
  }
  .thumb--terminal {
    padding: 10px 12px;
    font-family: "Courier New", monospace;
    font-size: 0.7rem;
    color: var(--card-accent, var(--accent));
    opacity: 0.75;
  }
  .thumb--terminal .row {
    height: 2px;
    background: var(--card-accent, var(--accent));
    opacity: 0.5;
    margin-bottom: 8px;
    border-radius: 1px;
    animation: type-row 3s ease-in-out infinite;
  }
  .thumb--terminal .row:nth-child(2) { width: 70%; animation-delay: 0.4s; }
  .thumb--terminal .row:nth-child(3) { width: 45%; animation-delay: 0.9s; }
  @keyframes type-row {
    0%, 100% { width: 0%; opacity: 0; }
    10% { opacity: 0.6; }
    50% { opacity: 0.6; }
    60% { opacity: 0; }
  }
  .thumb--orbit {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb--orbit .system {
    position: relative;
    width: 46px;
    height: 46px;
  }
  .thumb--orbit .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: var(--card-accent, var(--accent));
    box-shadow: 0 0 10px 2px var(--card-accent, var(--accent));
  }
  .thumb--orbit .ring {
    position: absolute;
    inset: 0;
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 50%;
    animation: spin 6s linear infinite;
  }
  .thumb--orbit .ring::before {
    content: "";
    position: absolute;
    top: -2px;
    left: 50%;
    width: 5px;
    height: 5px;
    margin-left: -2.5px;
    border-radius: 50%;
    background: var(--card-accent, var(--accent));
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  a.card h2 {
    margin: 0 0 0.5rem;
    font-size: 1.3rem;
    position: relative;
  }
  a.card p {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.4;
    position: relative;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    position: relative;
  }
  .tag {
    font-size: 0.72rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    grid-column: 1 / -1;
    padding: 3rem 1rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    margin-top: 4rem;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Experience</h1>
    <p>Un laboratorio de experiencias web independientes: arte generativo, juegos, instrumentos musicales, simulaciones, poesía visual, narrativas interactivas. Cada tarjeta es un mundo propio.</p>
  </header>
  <main class="grid" id="grid">
    <p class="empty">Cargando experiencias…</p>
  </main>
  <footer>hecho iteración a iteración</footer>

  <script>
    fetch('experiences/catalog.json')
      .then(r => r.json())
      .then(items => {
        const grid = document.getElementById('grid');
        if (!items.length) {
          grid.innerHTML = '<p class="empty">Aún no hay experiencias publicadas.</p>';
          return;
        }
        const thumbs = {
          waves: '<div class="thumb thumb--waves"><span></span><span></span><span></span></div>',
          grid: `<div class="thumb thumb--grid">${'<i></i>'.repeat(18)}</div>`,
          terminal: '<div class="thumb thumb--terminal"><div class="row"></div><div class="row"></div><div class="row"></div></div>',
          orbit: '<div class="thumb thumb--orbit"><div class="system"><div class="ring"></div><div class="core"></div></div></div>',
        };
        grid.innerHTML = items.map(item => `
          <a class="card" href="experiences/${item.slug}/" style="--card-accent:${item.accent || '#8ee3ff'}">
            ${thumbs[item.glyph] || ''}
            <h2>${item.title}</h2>
            <p>${item.description}</p>
            <div class="tags">${(item.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p class="empty">No se pudo cargar el catálogo.</p>';
      });
  </script>
</body>
</html>
