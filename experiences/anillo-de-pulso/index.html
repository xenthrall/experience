<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anillo de Pulso</title>
<style>
  :root {
    --bg: #060608;
    --bg2: #0d0e14;
    --text: #e9ecf5;
    --dim: #63677f;
    --target: #ff5a7a;
    --ring: #5ad1ff;
    --perfect: #ffe066;
    --good: #5ad1ff;
    --miss: #63677f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg) 75%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  a.back {
    position: fixed;
    top: 14px;
    left: 18px;
    color: var(--dim);
    text-decoration: none;
    font-size: 12px;
    z-index: 10;
  }
  a.back:hover { color: var(--ring); }
  .hud {
    position: fixed;
    top: 14px;
    right: 18px;
    text-align: right;
    font-size: 13px;
    color: var(--dim);
    z-index: 10;
    line-height: 1.6;
  }
  .hud b { color: var(--text); font-variant-numeric: tabular-nums; }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  svg { display: block; touch-action: manipulation; }
  #feedback {
    height: 1.4em;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #hint {
    color: var(--dim);
    font-size: 12.5px;
    max-width: 260px;
    text-align: center;
  }
  kbd {
    border: 1px solid #2a2e3f;
    border-radius: 5px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <a class="back" href="../../index.html">&larr; hub</a>
  <div class="hud">racha <b id="streak">0</b><br>mejor racha <b id="best">0</b></div>
  <main>
    <svg id="stage" width="260" height="260" viewBox="0 0 260 260">
      <circle cx="130" cy="130" r="70" fill="none" stroke="var(--target)" stroke-width="3" opacity="0.9"/>
      <circle id="pulse" cx="130" cy="130" r="120" fill="none" stroke="var(--ring)" stroke-width="4"/>
      <circle cx="130" cy="130" r="3" fill="var(--dim)"/>
    </svg>
    <div id="feedback"></div>
    <div id="hint">el anillo se contrae hacia el círculo rojo. Toca, haz clic o pulsa <kbd>espacio</kbd> justo cuando coincidan.</div>
  </main>

<script>
  const pulse = document.getElementById('pulse');
  const feedback = document.getElementById('feedback');
  const streakEl = document.getElementById('streak');
  const bestEl = document.getElementById('best');

  const TARGET_R = 70;
  const START_R = 122;
  const MIN_R = 4;
  let radius = START_R;
  let speed = 0.85;
  let streak = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('anillo-de-pulso-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;
  let alive = true;
  let judged = false;

  function resetRing() {
    radius = START_R;
    judged = false;
    alive = true;
    pulse.setAttribute('stroke', 'var(--ring)');
  }

  function tick() {
    if (alive) {
      radius -= speed;
      if (radius <= MIN_R) {
        if (!judged) missNow();
        radius = MIN_R;
      }
      pulse.setAttribute('r', radius.toFixed(2));
    }
    requestAnimationFrame(tick);
  }

  function showFeedback(text, color) {
    feedback.textContent = text;
    feedback.style.color = color;
    feedback.style.opacity = '1';
    setTimeout(() => { feedback.style.opacity = '0'; }, 500);
  }

  function setStreak(v) {
    streak = v;
    streakEl.textContent = streak;
    if (streak > best) {
      best = streak;
      bestEl.textContent = best;
      try { localStorage.setItem('anillo-de-pulso-best', String(best)); } catch (e) {}
    }
  }

  function missNow() {
    judged = true;
    alive = false;
    showFeedback('fallo', 'var(--miss)');
    setStreak(0);
    setTimeout(nextRound, 480);
  }

  function judge() {
    if (judged || !alive) return;
    judged = true;
    alive = false;
    const diff = Math.abs(radius - TARGET_R);
    if (diff < 4) {
      showFeedback('¡perfecto!', 'var(--perfect)');
      setStreak(streak + 1);
      speed = Math.min(speed + 0.12, 2.6);
    } else if (diff < 12) {
      showFeedback('bien', 'var(--good)');
      setStreak(streak + 1);
      speed = Math.min(speed + 0.06, 2.6);
    } else {
      showFeedback('impreciso', 'var(--miss)');
      setStreak(0);
      speed = Math.max(speed - 0.15, 0.7);
    }
    setTimeout(nextRound, 420);
  }

  function nextRound() {
    resetRing();
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); judge(); }
  });
  document.getElementById('stage').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    judge();
  });

  resetRing();
  requestAnimationFrame(tick);
</script>
</body>
</html>
